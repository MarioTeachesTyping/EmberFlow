# Repository-wide Python tooling configuration.
# This is not an installable package yet: subsystem owners (edge, controller,
# ml) will add their own dependencies/packaging as code is written.

[project]
name = "emberflow"
version = "0.0.0"
description = "EmberFlow distributed edge wildfire-smoke monitoring research prototype"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dashboard/frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["testing"]
addopts = "-ra"
